const CAM=[[0,{z:260,rx:0,ry:0,rz:-2,x:0,y:0}],[3.6,{z:-120,rx:2,ry:-1,rz:1,x:0,y:0}],[4.0,{z:380,rx:0,ry:0,rz:0,x:0,y:0}],[6,{z:0,rx:3,ry:-5,rz:0,x:-40,y:20}],[10,{z:-150,rx:-2,ry:7,rz:-1,x:50,y:0}],
